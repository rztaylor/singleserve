name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional release candidate version to validate (for example, v0.2.0-rc.1)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Build, smoke-test, and validate repository
        run: scripts/check.sh

  platform-tests:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test packages
        run: go test ./...

  browser-security:
    name: Real-browser security
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install Playwright test dependency
        run: npm ci --prefix client --ignore-scripts
      - name: Install browser engine
        working-directory: client
        run: ./node_modules/.bin/playwright install chromium
      - name: Run real-browser security contract
        env:
          SINGLESERVE_BROWSER_BACKEND: playwright
          SINGLESERVE_BROWSER_NAME: chromium
        run: scripts/check-browser-security.sh

  release-candidate:
    name: Release candidate validation
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install Playwright test dependency
        run: npm ci --prefix client --ignore-scripts
      - name: Install Chromium
        working-directory: client
        run: ./node_modules/.bin/playwright install chromium
      - name: Run release candidate policy
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SINGLESERVE_BROWSER_BACKEND: playwright
          SINGLESERVE_BROWSER_NAME: chromium
        run: scripts/release-check.sh "$RELEASE_VERSION"
